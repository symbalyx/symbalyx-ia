<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a14" />
<title>Symbalyx · Messagerie chiffrée</title>
<style>
  :root {
    --bg-0: #07070d;
    --bg-1: #0d0d18;
    --bg-2: #12121f;
    --glass: rgba(255, 255, 255, 0.04);
    --glass-strong: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text-0: #f5f5fa;
    --text-1: #c9c9d4;
    --text-2: #8a8a9a;
    --accent: #7c5cff;
    --accent-2: #4ad6c4;
    --danger: #ff5470;
    --ok: #4ad68a;
    --radius: 16px;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    --font: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text-0);
    background:
      radial-gradient(1200px 800px at 10% -10%, rgba(124, 92, 255, 0.18), transparent 60%),
      radial-gradient(900px 600px at 110% 110%, rgba(74, 214, 196, 0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Grain subtil */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.06'/></svg>");
    mix-blend-mode: overlay;
    opacity: 0.4;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

  /* ========== TOP BAR ========== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 22px rgba(124, 92, 255, 0.45);
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 16px;
    letter-spacing: 0.5px;
  }
  .brand-name { font-weight: 700; letter-spacing: 0.3px; font-size: 16px; }
  .brand-name span { color: var(--text-2); font-weight: 500; margin-left: 6px; }

  .secure-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: rgba(74, 214, 138, 0.08);
    border: 1px solid rgba(74, 214, 138, 0.28);
    color: #b6f0cf;
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.3px;
  }
  .secure-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ========== LOGIN ========== */
  .login-wrap {
    flex: 1; display: grid; place-items: center;
    padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 420px;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: var(--shadow);
  }
  .login-card h1 {
    margin: 0 0 6px 0; font-size: 24px; font-weight: 700;
  }
  .login-card .subtitle {
    color: var(--text-2); font-size: 14px; margin-bottom: 26px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; color: var(--text-2);
    margin-bottom: 8px; letter-spacing: 0.3px; text-transform: uppercase;
  }
  .field input {
    width: 100%; padding: 13px 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-0); font-size: 15px;
    font-family: inherit;
    transition: border-color .15s, background .15s, box-shadow .15s;
    outline: none;
  }
  .field input:focus {
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.06);
    box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
  }
  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), #5c7cff);
    color: #fff; border: 0; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .1s, box-shadow .15s, filter .15s;
    box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.6; cursor: not-allowed; }

  .login-foot {
    margin-top: 22px; text-align: center;
    font-size: 12px; color: var(--text-2);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .login-foot svg { width: 14px; height: 14px; opacity: 0.85; }

  .error-msg {
    margin-top: 14px; padding: 10px 12px;
    background: rgba(255, 84, 112, 0.08);
    border: 1px solid rgba(255, 84, 112, 0.35);
    color: #ffb3c0;
    border-radius: 10px; font-size: 13px;
    display: none;
  }
  .error-msg.show { display: block; }

  /* ========== CHAT ========== */
  .chat-wrap { flex: 1; display: none; }
  .chat-wrap.active { display: flex; }

  .chat-frame-container {
    flex: 1; position: relative;
    margin: 14px 18px 18px 18px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-2);
    box-shadow: var(--shadow);
  }
  .chat-frame-container iframe {
    width: 100%; height: 100%; border: 0; display: block;
    background: var(--bg-2);
  }

  .chat-overlay-banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 5;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: rgba(10, 10, 18, 0.75);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border-strong);
    color: var(--text-1);
    border-radius: 999px; font-size: 12px;
    pointer-events: none;
  }
  .chat-overlay-banner .lock {
    width: 14px; height: 14px; color: var(--ok);
  }

  .logout-btn {
    background: transparent; color: var(--text-1);
    border: 1px solid var(--border-strong);
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: background .15s, color .15s;
  }
  .logout-btn:hover { background: var(--glass-strong); color: var(--text-0); }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 640px) {
    .topbar { padding: 12px 14px; }
    .brand-name { font-size: 14px; }
    .brand-name span { display: none; }
    .secure-pill { padding: 6px 10px; font-size: 11px; }
    .secure-pill span { display: none; }
    .login-card { padding: 24px 20px; border-radius: 18px; }
    .login-card h1 { font-size: 20px; }
    .chat-frame-container { margin: 8px; border-radius: 12px; }
    .chat-overlay-banner { font-size: 11px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ========= TOP BAR ========= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">S</div>
      <div class="brand-name" id="brandName">Symbalyx<span>· secure</span></div>
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <div class="secure-pill" title="Chiffrement de bout en bout actif">
        <span class="dot"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Chiffré E2E</span>
      </div>
      <button class="logout-btn" id="logoutBtn" style="display:none">Déconnexion</button>
    </div>
  </header>

  <!-- ========= LOGIN ========= -->
  <main class="login-wrap" id="loginView">
    <div class="login-card">
      <h1>Connexion</h1>
      <div class="subtitle">Messagerie privée chiffrée de bout en bout.</div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="user">Identifiant</label>
          <input id="user" type="text" placeholder="alice" autocapitalize="off" autocorrect="off" required />
        </div>
        <div class="field">
          <label for="pass">Mot de passe</label>
          <input id="pass" type="password" placeholder="••••••••" required />
        </div>
        <button class="btn" type="submit" id="loginBtn">Se connecter</button>
        <div class="error-msg" id="loginError"></div>
      </form>

      <div class="login-foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Vos messages restent sur votre serveur local.
      </div>
    </div>
  </main>

  <!-- ========= CHAT (Element embedded) ========= -->
  <section class="chat-wrap" id="chatView">
    <div class="chat-frame-container">
      <div class="chat-overlay-banner">
        <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Conversation chiffrée de bout en bout
      </div>
      <iframe id="elementFrame" src="about:blank" allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write"></iframe>
    </div>
  </section>

</div>

<script>
/* =======================================================================
   Symbalyx UI — personnalisation
   ======================================================================= */
const CONFIG = {
  brandName:   "Symbalyx",
  brandSuffix: "· secure",
  brandLetter: "S",
  homeserver:  "http://localhost:8008",
  elementUrl:  "http://localhost:8080"
};

document.getElementById("brandLogo").textContent = CONFIG.brandLetter;
document.getElementById("brandName").innerHTML   =
  `${CONFIG.brandName}<span>${CONFIG.brandSuffix}</span>`;
document.title = `${CONFIG.brandName} · Messagerie chiffrée`;

/* ===================== AUTH ===================== */
const loginForm  = document.getElementById("loginForm");
const loginBtn   = document.getElementById("loginBtn");
const loginErr   = document.getElementById("loginError");
const loginView  = document.getElementById("loginView");
const chatView   = document.getElementById("chatView");
const logoutBtn  = document.getElementById("logoutBtn");
const elFrame    = document.getElementById("elementFrame");

function showError(msg) {
  loginErr.textContent = msg;
  loginErr.classList.add("show");
}
function clearError() {
  loginErr.classList.remove("show");
  loginErr.textContent = "";
}

async function matrixLogin(user, pass) {
  const res = await fetch(`${CONFIG.homeserver}/_matrix/client/v3/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: "m.login.password",
      identifier: { type: "m.id.user", user: user },
      password: pass,
      initial_device_display_name: "Symbalyx Web"
    })
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `Échec de la connexion (${res.status})`);
  }
  return res.json();
}

function openChat() {
  loginView.style.display = "none";
  chatView.classList.add("active");
  logoutBtn.style.display = "inline-flex";
  elFrame.src = CONFIG.elementUrl;
}

function showLogin() {
  chatView.classList.remove("active");
  loginView.style.display = "grid";
  logoutBtn.style.display = "none";
  elFrame.src = "about:blank";
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value;
  if (!user || !pass) return;

  loginBtn.disabled = true;
  loginBtn.textContent = "Connexion…";
  try {
    const data = await matrixLogin(user, pass);
    sessionStorage.setItem("symbalyx_user", data.user_id || user);
    openChat();
  } catch (err) {
    showError(err.message || "Identifiants invalides");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Se connecter";
  }
});

logoutBtn.addEventListener("click", () => {
  sessionStorage.removeItem("symbalyx_user");
  showLogin();
});

/* Auto-show login on load */
showLogin();
</script>
</body>
</html>

version: "3.8"

# ============================================================
#  Symbalyx Secure Messaging — Matrix Synapse + Element Web
#  Stack 100% locale, chiffrement E2E natif, zéro cloud.
# ============================================================
#
#  Services :
#   - postgres  : base de données du serveur Matrix
#   - synapse   : serveur Matrix (homeserver)
#   - element   : client Web Matrix officiel
#   - coturn    : serveur TURN/STUN pour les appels voix/vidéo
#   - ui        : interface custom Symbalyx (page d'accueil)
#
#  Réseau local uniquement. Aucun port n'est exposé sur Internet.
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: symbalyx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_local_pw_change_me
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - symbalyx_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: symbalyx_synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: "localhost"
      SYNAPSE_REPORT_STATS: "no"
      UID: "991"
      GID: "991"
      TZ: "Europe/Paris"
    volumes:
      - ./data/synapse:/data
    ports:
      - "8008:8008"
    networks:
      - symbalyx_net
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  element:
    image: vectorim/element-web:latest
    container_name: symbalyx_element
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./element/config.json:/app/config.json:ro
    ports:
      - "8080:80"
    networks:
      - symbalyx_net

  coturn:
    image: coturn/coturn:latest
    container_name: symbalyx_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro

  ui:
    image: nginx:alpine
    container_name: symbalyx_ui
    restart: unless-stopped
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8090:80"
    networks:
      - symbalyx_net

networks:
  symbalyx_net:
    driver: bridge
